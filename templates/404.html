<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 - Page Not Found</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-50 to-indigo-100 min-h-screen flex items-center justify-center">
    <div class="bg-white px-10 py-12 rounded-2xl shadow-xl text-center">
        <div class="text-5xl mb-4 text-blue-400">📚</div>
        <div class="text-7xl font-extrabold text-indigo-500 mb-2">404</div>
        <div class="text-xl text-slate-700 mb-8">Oops! The page you're looking for can't be found.</div>
        <a href="{% url 'main:index' %}" class="inline-block px-8 py-3 text-white bg-gradient-to-r from-indigo-500 to-blue-400 rounded-lg shadow hover:from-blue-400 hover:to-indigo-500 transition">
            Return to Homepage
        </a>
    </div>
</body>
</html>
